<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo da Cobrinha</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* (SEU CSS ORIGINAL — NÃO ALTERADO) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      position: relative;
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .side-left,
    .side-right {
      position: absolute;
      top: 0;
      width: 25%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .side-left {
      left: 0;
      background-image: url('./Fundo.png');
    }

    .side-right {
      right: 0;
      background-image: url('./Fundo.png');
      transform: scaleX(-1);
    }

    .divider-left,
    .divider-right {
      position: absolute;
      top: 0;
      width: 4px;
      height: 100%;
      background-color: #00ff99;
      z-index: 1;
    }

    .divider-left { left: 25%; }
    .divider-right { right: 25%; }

    .screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #00ff99;
    }

    .btn {
      background-color: #00ff99;
      border: none;
      color: #000;
      padding: 12px 25px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
    }

    canvas {
      background-color: #111;
      border: 4px solid #00ff99;
      border-radius: 12px;
    }

    .container {
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>
  <div id="pauseScreen" class="screen" style="display: none;">
  <h1>⏸️ Pausado</h1>
  <button id="resumeBtn" class="btn">Voltar ao jogo</button>
  <button id="pauseSettingsBtn" class="btn">Configurações</button>
  <button id="pauseMenuBtn" class="btn">Voltar ao menu</button>
</div>

  <div class="side-left"></div>
  <div class="side-right"></div>
  <div class="divider-left"></div>
  <div class="divider-right"></div>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>🐍 Jogo da Cobrinha 🐍</h1>
    <button id="startBtn" class="btn">Iniciar Jogo</button>
    <button id="settingsBtn" class="btn">Configurações</button>
    <button id="exitBtn" class="btn">Sair</button>
  </div>

  <!-- CONFIG -->
  <div id="settingsScreen" class="screen" style="display:none;">
    <h1>⚙️ Configurações</h1>
    <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.5">
    <input type="range" id="effectsVolume" min="0" max="1" step="0.01" value="0.5">
    <button id="backFromSettings" class="btn">Voltar</button>
  </div>

  <!-- JOGO -->
  <div class="container screen" style="display:none;">
    <canvas id="game" width="400" height="400"></canvas>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen" class="screen" style="display:none;">
    <h1>💀 Game Over 💀</h1>
    <p id="finalScore">Pontuação: 0</p>
    <button id="restartBtn" class="btn">Reiniciar</button>
    <button id="menuBtn" class="btn">Menu</button>
  </div>
  
  <!-- VITÓRIA -->
  <div id="victoryScreen" class="screen" style="display:none;">
    <h1>🏆 Vitória! 🏆</h1>
    <img src="Premio.png" style="width:200px; margin:20px 0;">
    <button id="victoryMenuBtn" class="btn">Voltar ao Menu</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
